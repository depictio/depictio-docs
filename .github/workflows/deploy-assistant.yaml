name: Deploy Docs Assistant

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'assistant/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'assistant/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-index even if it would delete a large share of the index'
        required: false
        default: 'false'

# Two indexers running at once would race on the id set in KV.
concurrency:
  group: docs-assistant
  cancel-in-progress: false

jobs:
  # Runs on pull requests too: a citation whose anchor does not resolve is worse
  # than no citation, and this is the only thing that catches it.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync

      - name: Build site
        run: uv run mkdocs build

      - name: Verify chunk anchors resolve
        run: uv run python assistant/indexer/build_index.py --verify

      - name: Chunk report
        run: |
          echo '## Assistant index' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run python assistant/indexer/build_index.py --dry-run >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  reindex:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync

      - name: Re-index
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
        run: |
          uv run python assistant/indexer/build_index.py --upsert \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Summary
        if: always()
        run: |
          echo '## Assistant re-index' >> $GITHUB_STEP_SUMMARY
          cat assistant/.last-run-summary.md >> $GITHUB_STEP_SUMMARY || true

  deploy-worker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Only redeploy when the worker itself changed. `git diff` against the
      # push range rather than head_commit.modified, which only sees the last
      # commit of a multi-commit push.
      - name: Did the worker change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "yes=true" >> $GITHUB_OUTPUT
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- assistant/src assistant/wrangler.toml; then
            echo "yes=false" >> $GITHUB_OUTPUT
          else
            echo "yes=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.yes == 'true'
        with:
          node-version: '20'

      - name: Deploy worker
        if: steps.changed.outputs.yes == 'true'
        working-directory: assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
