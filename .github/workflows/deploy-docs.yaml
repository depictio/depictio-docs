name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v0.6.0-b5)'
        required: true
      alias:
        description: 'Alias (latest, beta, or none)'
        required: false
        default: 'beta'

# One deployment at a time: every run commits to gh-pages, so parallel runs
# race on the push and the loser fails (four merges in a row, 2026-11-24). A
# run waits for the one in progress; a newer push replaces a run still waiting,
# so the latest main is what lands.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy-mike:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync

      - name: Get version from pyproject.toml
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            ALIAS="${{ github.event.inputs.alias }}"
          else
            VERSION="v$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')"
            # Beta releases get 'beta' alias, stable get 'latest'
            if [[ "$VERSION" == *"-b"* ]]; then
              ALIAS="beta"
            else
              ALIAS="latest"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "alias=${ALIAS}" >> $GITHUB_OUTPUT

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Deploy with mike
        env:
          # Keeps the bulky image subtrees out of the per-version build; they
          # are published once by the next step. See hooks/shared_images.py.
          DEPICTIO_DOCS_SHARED_IMAGES: '1'
          # The catalog page embeds the catalog of the version deployed here,
          # which a manual run can set apart from pyproject.toml.
          DEPICTIO_DOCS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ALIAS="${{ steps.version.outputs.alias }}"

          if [ "$ALIAS" == "latest" ]; then
            # Stable releases get both 'latest' and 'stable' aliases
            uv run mike deploy --push --update-aliases "$VERSION" latest stable
            # Set stable as default for root redirect
            uv run mike set-default --push stable
          elif [ "$ALIAS" != "none" ] && [ -n "$ALIAS" ]; then
            uv run mike deploy --push --update-aliases "$VERSION" "$ALIAS"
          else
            uv run mike deploy --push "$VERSION"
          fi

      # Runs after mike has pushed, so writes to gh-pages stay ordered.
      - name: Publish shared image root
        run: ./scripts/publish-shared-images.sh

      # The catalog is its own site now (depictio/depictio-catalog, built by
      # depictio's deploy-catalog.yaml); hooks/catalog_site.py points the page
      # at it. Pages of earlier versions still embed the old one-page
      # gallery from the site-root assets/: these few-hundred-byte stubs stand
      # in for those two ~65 MB files and send the iframe to the catalog site.
      - name: Publish catalog gallery stubs for archived versions
        run: |
          ./scripts/publish-shared-images.sh --dest assets \
            --file redirects/assets/component-catalog-light.html \
            --file redirects/assets/component-catalog-dark.html

      # A page and the images it points at now live in different places, so
      # they can disagree, and nothing at build time notices: the deploy
      # succeeds and the pages come out with broken images. Checked against the
      # branch we just pushed, so there is no wait for Pages to publish.
      - name: Verify shared assets resolve
        run: ./scripts/verify-shared-assets.py --version "${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          echo "## Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Alias**: ${{ steps.version.outputs.alias }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://depictio.github.io/depictio-docs/${{ steps.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
