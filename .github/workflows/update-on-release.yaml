name: Update Docs on Release

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.6.0-b5)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # The monolithic depictio/depictio image was split into per-service images;
  # the FastAPI app (and thus the OpenAPI schema) now lives in depictio-api.
  IMAGE_NAME: depictio/depictio-api

jobs:
  create-update-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: read

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="false"
          else
            VERSION="${{ github.event.client_payload.version }}"
            PRERELEASE="${{ github.event.client_payload.prerelease }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_tag=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "branch=docs/update-${VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OpenAPI specification
        run: |
          # Pull the released image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }}

          # Generate OpenAPI schema directly without starting the server
          # This avoids the need for MongoDB and other dependencies
          echo "Generating OpenAPI specification..."
          # Importing depictio.api.main builds the Settings model, which in
          # server context rejects an unset/default MinIO root password — even
          # in single-user mode (that flag only relaxes the auth-password
          # checks). Pass a throwaway strong password so the model validates;
          # no server, DB or real secrets are started — we only need the app
          # object to call app.openapi().
          docker run --rm \
            -e DEPICTIO_CONTEXT=server \
            -e DEPICTIO_AUTH_SINGLE_USER_MODE=true \
            -e DEPICTIO_MINIO_ROOT_PASSWORD=openapi-extract-not-a-real-secret \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }} \
            python -c "import json; from depictio.api.main import app; print(json.dumps(app.openapi(), indent=2))" \
            > docs/api/openapi.json

          # Verify the file is valid JSON and has content
          echo "Validating OpenAPI specification..."
          if ! jq empty docs/api/openapi.json 2>/dev/null; then
            echo "Error: Invalid JSON in openapi.json"
            cat docs/api/openapi.json
            exit 1
          fi

          # Check file has actual content (not empty)
          FILE_SIZE=$(stat -f%z docs/api/openapi.json 2>/dev/null || stat -c%s docs/api/openapi.json)
          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "Error: openapi.json is too small ($FILE_SIZE bytes)"
            cat docs/api/openapi.json
            exit 1
          fi

          # Verify has paths
          PATH_COUNT=$(jq '.paths | keys | length' docs/api/openapi.json)
          if [ "$PATH_COUNT" -lt 10 ]; then
            echo "Error: openapi.json has too few endpoints ($PATH_COUNT)"
            exit 1
          fi

          # Add generation metadata
          jq --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg version "${{ steps.version.outputs.version }}" \
             '.info["x-generated-at"] = $date | .info["x-depictio-version"] = $version' \
             docs/api/openapi.json > /tmp/openapi.json
          mv /tmp/openapi.json docs/api/openapi.json

          echo "OpenAPI spec extracted successfully: $PATH_COUNT endpoints"

      - name: Generate the CLI command reference
        run: |
          # The same image: Dockerfile.api copies depictio/ (depictio/cli included)
          # and installs the core dependencies, typer among them, so dump.py can
          # import the CLI and walk its commands. No server or database starts.
          # dump.py writes to a mounted folder rather than stdout, so a log line
          # printed while importing cannot end up in the JSON.
          mkdir -p "$RUNNER_TEMP/cli-reference"
          chmod 777 "$RUNNER_TEMP/cli-reference"
          docker run --rm \
            -e DEPICTIO_TELEMETRY_ENABLED=false \
            -v "$PWD/scripts/cli-reference:/cli-reference:ro" \
            -v "$RUNNER_TEMP/cli-reference:/out" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.image_tag }} \
            python /cli-reference/dump.py -o /out/cli-reference.json

          # dump.py exits non-zero on too few commands or options; check the JSON
          # here too, as for the OpenAPI spec, before it replaces the committed one.
          echo "Validating CLI reference..."
          if ! jq empty "$RUNNER_TEMP/cli-reference/cli-reference.json" 2>/dev/null; then
            echo "Error: Invalid JSON in cli-reference.json"
            exit 1
          fi
          COMMAND_COUNT=$(jq '[.commands[] | select(.hidden | not)] | length' "$RUNNER_TEMP/cli-reference/cli-reference.json")
          OPTION_COUNT=$(jq '[.commands[] | select(.hidden | not) | .params[] | select(.kind == "option" and (.hidden | not))] | length' "$RUNNER_TEMP/cli-reference/cli-reference.json")
          if [ "$COMMAND_COUNT" -lt 35 ] || [ "$OPTION_COUNT" -lt 120 ]; then
            echo "Error: cli-reference.json has too few commands ($COMMAND_COUNT) or options ($OPTION_COUNT)"
            exit 1
          fi
          cp "$RUNNER_TEMP/cli-reference/cli-reference.json" docs/depictio-cli/cli-reference.json

          # Standard library only: renders docs/depictio-cli/usage.md from the JSON,
          # validates it, then checks it is what the pre-commit hook expects.
          python3 scripts/cli-reference/render.py
          python3 scripts/cli-reference/render.py --check

          echo "CLI reference generated: $COMMAND_COUNT commands, $OPTION_COUNT options"

      - name: Update pyproject.toml version
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.image_tag }}\"/" pyproject.toml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.version.outputs.branch }}
          base: main
          commit-message: "docs: update for ${{ steps.version.outputs.version }}"
          title: "docs: Update for ${{ steps.version.outputs.version }}"
          body: |
            ## Automated Documentation Update

            This PR updates the documentation for **${{ steps.version.outputs.version }}**.

            ### Changes
            - Updated OpenAPI specification from released Docker image
            - Regenerated the CLI command reference (docs/depictio-cli/usage.md) from the same image
            - Updated version in pyproject.toml

            ### Source
            - Release: ${{ github.event.client_payload.release_url || 'Manual trigger' }}
            - Pre-release: ${{ steps.version.outputs.prerelease }}

            ---
            *This PR was automatically created by the docs update workflow.*
          labels: |
            documentation
            automated
          draft: false
          add-paths: |
            docs/api/openapi.json
            docs/depictio-cli/cli-reference.json
            docs/depictio-cli/usage.md
            pyproject.toml

      - name: Summary
        run: |
          echo "## Documentation Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.version.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: ${{ steps.version.outputs.prerelease }}" >> $GITHUB_STEP_SUMMARY
