# Serves the git-sync checkout of gh-pages. `current` is a symlink that git-sync
# swaps atomically, and nginx resolves it on every request.
server {
    listen 8080;
    server_name _;
    root /git/current;
    index index.html;
    charset utf-8;

    # Behind the ingress the pod port must not leak into redirects.
    absolute_redirect off;

    # hooks/shared_images.py points every version at one image root by absolute
    # URL on GitHub Pages. Serve those from here instead, or the images break
    # the day Pages only holds the redirect. Runs before gzip, on files read
    # from disk, so the responses are still compressed.
    sub_filter_types text/css application/javascript application/json;
    sub_filter_once off;
    sub_filter 'https://depictio.github.io/depictio-docs/' '/';

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/xml text/xml text/plain;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Every version was built with site_url https://depictio.github.io/depictio-docs/,
    # so absolute links, the 404 page and the search index carry that prefix.
    location = /depictio-docs {
        return 301 /;
    }
    location ^~ /depictio-docs/ {
        rewrite ^/depictio-docs/(.*)$ /$1 last;
    }

    location ~* \.(?:css|js|json|png|jpe?g|gif|webp|svg|ico|woff2?|mp4|webm)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
