# Site Information
site_name: Depictio Documentation
site_url: https://depictio.github.io/depictio-docs/
site_description: "Documentation for Depictio"

# Hand-written notes the CLI reference includes with pymdownx.snippets
# (scripts/cli-reference/render.py): not pages of their own.
exclude_docs: |
  /depictio-cli/_notes/

# Repository Information
repo_url: https://github.com/depictio/depictio
repo_name: depictio/depictio

# Copyright Information
copyright: Copyright &copy; 2023 - 2026 Thomas Weber

# Theme Configuration
theme:
  name: material
  custom_dir: overrides
  icon:
    annotation: material/record-circle
  logo: "images/logo/animated_favicon.svg"
  favicon: "images/logo/logo_icon.png"

  # Color Settings
  palette:
    - scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

  # UI Features
  features:
    # Content
    - content.code.copy
    - content.code.select
    - content.code.annotate

    # Navigation
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.expand
    - navigation.top

    # Header
    - header.autohide

    # TOC
    - toc.follow

    # Search
    - search.highlight
    - search.share
    - search.suggest

    # Other
    - announce.dismiss

# Extra CSS
extra_css:
  - stylesheets/extra.css
  - stylesheets/timeline.css
  - stylesheets/blog.css
  - stylesheets/neoteroi-mkdocs-v1.1.3.css
  - stylesheets/asciinema.css
  - stylesheets/cards.css
  - stylesheets/cli.css
  # - stylesheets/css-v1.0.4.css
  - https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css
  - https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css

# Extra JavaScript
extra_javascript:
  - javascripts/sidebar-offset.js
  - javascripts/depictio-rose.js
  - javascripts/depictio-logo.js
  - javascripts/depictio-theme-sync.js
  - javascripts/catalog-site.js
  - javascripts/template-version.js
  - javascripts/template-showcase.js
  - javascripts/nav-pinned.js
  - javascripts/doc-sections.js
  - javascripts/template-catalog.js
  - javascripts/asciinema.js
  - javascripts/theme-video.js
  - javascripts/lazy-video.js

# Markdown Extensions
markdown_extensions:
  # Basic Extensions
  - admonition
  - attr_list
  - def_list
  - meta
  - md_in_html
  - footnotes

  # Timeline
  - neoteroi.timeline


  # PyMdown Extensions
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      auto_title: false
      linenums: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.snippets:
      base_path:
        - docs
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Table of Contents
  - toc:
      title: On this page
      permalink: true

# Build hooks
# shared_images keeps the bulky image subtrees out of each versioned build and
# serves them from one copy at the site root. Only active when
# DEPICTIO_DOCS_SHARED_IMAGES=1 (set by the deploy workflow), so `mkdocs serve`
# behaves exactly as before.
# landing_stats fills the home page's "Depictio in numbers" placeholders from
# docs/data/landing_stats.json (rebuilt by dev/landing_stats.py).
hooks:
  - hooks/nextflow_lexer.py
  - hooks/shared_images.py
  - hooks/landing_stats.py
  - hooks/catalog_site.py

# Plugins
plugins:
  - search
  # llms.txt (an index of the pages) and llms-full.txt (every page as clean
  # Markdown) at the site root, for AI agents and LLM tools; see llmstxt.org.
  - llmstxt:
      # mike serves every version under its own folder; agents read the latest.
      base_url: https://depictio.github.io/depictio-docs/latest/
      full_output: llms-full.txt
      markdown_description: >
        Depictio turns bioinformatics pipeline results into interactive, shareable
        dashboards: a FastAPI backend, a React viewer, MongoDB, S3 storage and a
        Python CLI that ingests results. Every CLI command and option is also
        available as JSON at depictio-cli/cli-reference.json.
      sections:
        Start:
          - index.md: What depictio is, with the main features
          - usage/get_started.md: First steps, from install to a first dashboard
          - tutorials/index.md: Tutorials
        Installation:
          - installation/README.md
          - installation/docker.md
          - installation/kubernetes.md
          - installation/local.md
          - installation/cli.md
          - installation/configuration.md
          - installation/env-reference.md
          - installation/sso/*.md
          - installation/upgrade/*.md
        Using depictio:
          - usage/README.md
          - usage/guides/*.md
          - usage/administration/*.md
        Projects:
          - usage/projects/*.md
        CLI:
          - depictio-cli/index.md
          - depictio-cli/tasks.md: One command per task
          - depictio-cli/usage.md: Every command and option, generated from the CLI
          - depictio-cli/minimal_config.md
        Workflow managers:
          - workflows/index.md
          - workflows/nextflow/index.md
          - workflows/nextflow/trigger.md
          - workflows/nextflow/subworkflow.md
        Features:
          - features/*.md
        API:
          - api/*.md
        # The per-pipeline template pages (140) and the changelog would make
        # llms-full.txt several MB; the catalog page lists every template.
        Templates:
          - pipeline-templates/README.md: Every pipeline template, with links to each one
        Developer:
          - developer/*.md
        Optional:
          - FAQ/*.md
          - roadmap/README.md
  # Old addresses of moved pages keep working.
  - redirects:
      redirect_maps:
        depictio-cli/nextflow-trigger.md: workflows/nextflow/trigger.md
        depictio-cli/nextflow-publish.md: workflows/nextflow/subworkflow.md
  # Click a screenshot to open it full size. manual: true keeps this opt-in, so
  # a page only gets lightboxes when its front matter says `glightbox: true`
  # (or an image carries `.on-glb`); every other page renders as before. Images
  # marked `.off-glb` are skipped even on an opted-in page, which is what keeps
  # inline logos from becoming clickable.
  - glightbox:
      manual: true
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      # #only-light / #only-dark screenshots go to separate galleries, so the
      # lightbox arrows step through one theme's images, not both copies.
      auto_themed: true
      caption_position: bottom
  - inline-select-svg:
      pattern: "images/logo/animated_favicon.svg"
      replace_tag: true
      add_class: "inline-svg"
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_date_format: medium
      post_url_format: "{slug}"
      post_excerpt_separator: <!-- more -->
      blog_toc: true
      pagination_per_page: 10
      pagination_url_format: "page/{page}"
      categories_allowed:
        - Announcements
        - Launch
        - Demo
        - Tutorials
        - Features
        - Community
        - Technical
        - Development
        - Performance
        - Architecture
        - UI/UX
        - Database
  - swagger-ui-tag
  - kroki:
      ServerURL: "https://kroki.io"
      EnableExcalidraw: true
      FileTypes:
        - svg

# Extra Configuration
extra:
  # Social Links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/depictio/depictio
      name: GitHub

  # Version Provider
  version:
    provider: mike
    default: stable

  # Google Analytics
  analytics:
    provider: google
    property: G-J14FKHSHLC

  # DocBot (EMBL-EBI docs chatbot), the embedded widget rendered by
  # overrides/main.html, on every page, locked to the depictio team. The team is
  # live on DocBot dev (November 2026). The widget only works once DocBot adds
  # https://depictio.github.io to its CORS allow-list; before that it opens but
  # cannot load or answer. Switch the backend to production (www.ebi.ac.uk) once
  # DocBot deploys depictio there. Off until the CORS entry is in; then set the
  # default below to true. DEPICTIO_DOCS_DOCBOT=1 turns it on to test locally.
  docbot:
    enabled: !ENV [DEPICTIO_DOCS_DOCBOT, false]
    team: depictio
    # Production: https://www.ebi.ac.uk/docbot/api
    backend: https://wwwdev.ebi.ac.uk/docbot/api
    sdk: https://docbot-64c680.gitdocs.ebi.ac.uk

