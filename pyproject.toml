[project]
dependencies = [
    "mkdocstrings-python",
    "mkdocs",
    "mkdocs-material>=9.7.0",
    "mkdocs-material-extensions",
    "mkdocs-render-swagger-plugin",
    "mkdocs-typer",
    "mkdocs-swagger-ui-tag",
    "mike",
    "neoteroi-mkdocs",
    "mkdocstrings",
    "mkdocstrings-python",
    "pre-commit",
    "mkdocs-inline-select-svg-plugin",
    "mkdocs-kroki-plugin",
    "mkdocs-graphviz"
]
version = "1.3.0"
name = "depictio-docs"

# Only needed to regenerate the figures in dev/diagrams/. The PNGs are
# committed, so the docs build never touches this: `uv sync --group diagrams`.
[dependency-groups]
diagrams = ["playwright"]
