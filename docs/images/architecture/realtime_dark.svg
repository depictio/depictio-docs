  <text x="30.0" y="448.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0ac" text-anchor="start" font-weight="normal">On when the server sets <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.4">DEPICTIO_EVENTS_ENABLED=true</tspan> and the project's YAML has <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.4">realtime: enabled: true</tspan>.</text>
  <text x="30.0" y="468.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#9aa0ac" text-anchor="start" font-weight="normal">A socket signs in with the access token, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.4">/depictio/api/v1/events/ws</tspan>, and needs viewer access to the dashboard.</text>
