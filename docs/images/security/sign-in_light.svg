<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
  <text x="30.0" y="44.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" text-anchor="start" font-weight="bold">Signing in, then every request</text>
  <text x="30.0" y="70.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#5c5c5c" text-anchor="start" font-weight="normal">signed tokens, checked on every call, and revoked by deleting them</text>
  <text x="30.0" y="112.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="start" font-weight="bold">Three ways in</text>
  <rect x="30.0" y="126.0" width="290.0" height="92.0" rx="12" fill="#ecf2fd" stroke="#a2bff4" stroke-width="1.5"/>
  <path transform="translate(43.5,140.5) scale(0.8750)" d="M21 18h-6v-3h-1.7c-1.1 2.4-3.6 4-6.3 4c-3.9 0-7-3.1-7-7s3.1-7 7-7c2.7 0 5.2 1.6 6.3 4H24v6h-3zm-4-2h2v-3h3v-2H11.9l-.2-.7C11 8.3 9.1 7 7 7c-2.8 0-5 2.2-5 5s2.2 5 5 5c2.1 0 4-1.3 4.7-3.3l.2-.7H17zM7 15c-1.7 0-3-1.3-3-3s1.3-3 3-3s3 1.3 3 3s-1.3 3-3 3m0-4c-.6 0-1 .4-1 1s.4 1 1 1s1-.4 1-1s-.4-1-1-1" fill="#6495ED"/>
  <text x="74.0" y="157.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#4465a1" text-anchor="start" font-weight="bold">Password</text>
  <text x="46.0" y="182.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">POST <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.9">/auth/login</tspan>, rate-limited</text>
  <text x="46.0" y="202.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">per address</text>
  <rect x="30.0" y="230.0" width="290.0" height="92.0" rx="12" fill="#f3edf9" stroke="#c2a3e0" stroke-width="1.5" stroke-dasharray="7 5"/>
  <path transform="translate(43.5,244.5) scale(0.8750)" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5zm0 2.18 7 3.12v4.92c0 1.7-.5 3.43-1.35 4.95C16 14.94 13.26 14.5 12 14.5s-4 .44-5.65 1.67C5.5 14.65 5 12.92 5 11.22V6.3zM12 6a3.5 3.5 0 0 0-3.5 3.5A3.5 3.5 0 0 0 12 13a3.5 3.5 0 0 0 3.5-3.5A3.5 3.5 0 0 0 12 6m0 2a1.5 1.5 0 0 1 1.5 1.5A1.5 1.5 0 0 1 12 11a1.5 1.5 0 0 1-1.5-1.5A1.5 1.5 0 0 1 12 8m0 8.5c1.57 0 3.64.61 4.53 1.34C15.29 19.38 13.7 20.55 12 21c-1.7-.45-3.29-1.62-4.53-3.16.9-.73 2.96-1.34 4.53-1.34" fill="#9966CC"/>
  <text x="74.0" y="261.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#68458b" text-anchor="start" font-weight="bold">Single sign-on</text>
  <text x="46.0" y="286.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">OpenID Connect with PKCE, then</text>
  <text x="46.0" y="306.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">a 2-minute, single-use ticket</text>
  <rect x="30.0" y="334.0" width="290.0" height="92.0" rx="12" fill="#e9f6f5" stroke="#8fd4cd" stroke-width="1.5"/>
  <path transform="translate(43.5,348.5) scale(0.8750)" d="M20 19V7H4v12zm0-16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm-7 14v-2h5v2zm-3.42-4L5.57 9H8.4l3.3 3.3c.39.39.39 1.03 0 1.42L8.42 17H5.59z" fill="#45B8AC"/>
  <text x="74.0" y="365.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#2f7d75" text-anchor="start" font-weight="bold">CLI token</text>
  <text x="46.0" y="390.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">made in Account settings, kept</text>
  <text x="46.0" y="410.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.9">~/.depictio/CLI.yaml</tspan></text>
  <g filter="url(#sh)"><rect x="372.0" y="126.0" width="236.0" height="300.0" rx="12" fill="#ffffff" stroke="#a2bff4" stroke-width="1.6"/></g>
  <path d="M373.0,170.0 V138.0 Q373.0,127.0 384.0,127.0 H596.0 Q607.0,127.0 607.0,138.0 V170.0 Z" fill="#ecf2fd"/>
  <path d="M372.0,170.0 L608.0,170.0" fill="none" stroke="#a2bff4" stroke-width="1.2" stroke-linecap="round"/>
  <path transform="translate(387.5,137.5) scale(0.8750)" d="M21 18h-6v-3h-1.7c-1.1 2.4-3.6 4-6.3 4c-3.9 0-7-3.1-7-7s3.1-7 7-7c2.7 0 5.2 1.6 6.3 4H24v6h-3zm-4-2h2v-3h3v-2H11.9l-.2-.7C11 8.3 9.1 7 7 7c-2.8 0-5 2.2-5 5s2.2 5 5 5c2.1 0 4-1.3 4.7-3.3l.2-.7H17zM7 15c-1.7 0-3-1.3-3-3s1.3-3 3-3s3 1.3 3 3s-1.3 3-3 3m0-4c-.6 0-1 .4-1 1s.4 1 1 1s1-.4 1-1s-.4-1-1-1" fill="#6495ED"/>
  <text x="418.0" y="154.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#4465a1" text-anchor="start" font-weight="bold">The API signs</text>
  <text x="388.0" y="194.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">with its private key, RS256</text>
  <text x="388.0" y="214.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">by default</text>
  <text x="388.0" y="254.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="bold">browser session</text>
  <text x="388.0" y="274.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">access token: 1 hour</text>
  <text x="388.0" y="294.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">refresh token: 7 days</text>
  <text x="388.0" y="330.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="bold">CLI</text>
  <text x="388.0" y="350.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">1 year</text>
  <rect x="384.0" y="372.0" width="212.0" height="40.0" rx="8" fill="#f1f8e9" stroke="#b9db92" stroke-width="1.2"/>
  <path transform="translate(393.5,383.5) scale(0.7083)" d="M12 3C7.58 3 4 4.79 4 7v10c0 2.21 3.59 4 8 4s8-1.79 8-4V7c0-2.21-3.58-4-8-4m6 14c0 .5-2.13 2-6 2s-6-1.5-6-2v-2.23c1.61.78 3.72 1.23 6 1.23s4.39-.45 6-1.23zm0-4.55c-1.3.95-3.58 1.55-6 1.55s-4.7-.6-6-1.55V9.64c1.47.83 3.61 1.36 6 1.36s4.53-.53 6-1.36zM12 9C8.13 9 6 7.5 6 7s2.13-2 6-2 6 1.5 6 2-2.13 2-6 2" fill="#8BC34A"/>
  <text x="418.0" y="397.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#466225" text-anchor="start" font-weight="normal">kept in MongoDB <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.9">tokens</tspan></text>
  <path d="M320.0,172.0 L372.0,198.0" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M372.0,198.0 L363.9,186.6" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M372.0,198.0 L358.0,198.4" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M320.0,276.0 L372.0,276.0" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M372.0,276.0 L359.6,269.4" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M372.0,276.0 L359.6,282.6" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M320.0,380.0 L372.0,354.0" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M372.0,354.0 L358.0,353.6" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M372.0,354.0 L363.9,365.4" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
