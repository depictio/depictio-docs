  <path d="M661.0,170.0 V138.0 Q661.0,127.0 672.0,127.0 H918.0 Q929.0,127.0 929.0,138.0 V170.0 Z" fill="#efecf8"/>
  <path d="M660.0,170.0 L930.0,170.0" fill="none" stroke="#af9edd" stroke-width="1.2" stroke-linecap="round"/>
  <path transform="translate(675.5,137.5) scale(0.8750)" d="M21 11c0 5.55-3.84 10.74-9 12-5.16-1.26-9-6.45-9-12V5l9-4 9 4zm-9 10c3.75-1 7-5.46 7-9.78V6.3l-7-3.12L5 6.3v4.92C5 15.54 8.25 20 12 21m-2-4-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9" fill="#7A5DC7"/>
  <text x="706.0" y="154.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#533f87" text-anchor="start" font-weight="bold">Every request</text>
  <circle cx="684.0" cy="189.0" r="11" fill="#7A5DC7"/>
  <text x="684.0" y="193.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text>
  <text x="704.0" y="194.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.9">Authorization: Bearer</tspan></text>
  <text x="704.0" y="213.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">carries the access token</text>
  <circle cx="684.0" cy="247.0" r="11" fill="#7A5DC7"/>
  <text x="684.0" y="251.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text>
  <text x="704.0" y="252.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">signature and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.9">exp</tspan> checked,</text>
  <text x="704.0" y="271.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">the algorithm pinned</text>
  <circle cx="684.0" cy="305.0" r="11" fill="#7A5DC7"/>
  <text x="684.0" y="309.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
  <text x="704.0" y="310.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">still in MongoDB? Deleting</text>
  <text x="704.0" y="329.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">a token revokes it</text>
  <circle cx="684.0" cy="363.0" r="11" fill="#7A5DC7"/>
  <text x="684.0" y="367.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text>
  <text x="704.0" y="368.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">the user, then their role</text>
  <text x="704.0" y="387.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1e1e1e" text-anchor="start" font-weight="normal">on what they asked for</text>
  <path d="M608.0,276.0 L660.0,276.0" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M660.0,276.0 L647.6,269.4" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M660.0,276.0 L647.6,282.6" fill="none" stroke="#5c5c5c" stroke-width="1.7" stroke-linecap="round"/>
  <text x="634.0" y="266.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5c5c5c" text-anchor="middle" font-weight="normal">token</text>
  <text x="30.0" y="466.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">The browser keeps the pair in local storage; as the access token nears expiry, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.9">/auth/refresh</tspan> trades the refresh</text>
  <text x="30.0" y="487.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5c5c5c" text-anchor="start" font-weight="normal">token for a new one. Single-user mode signs every visitor in as the admin; public mode gives each a guest account.</text>
</svg>
