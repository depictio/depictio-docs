<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
  <rect width="960" height="470" fill="#1f2129"/>
  <defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/></filter></defs>
  <text x="30.0" y="44.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#e3e3e3" text-anchor="start" font-weight="bold">Who can open what</text>
  <text x="30.0" y="70.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9aa0ac" text-anchor="start" font-weight="normal">one module, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.2">permissions.py</tspan>, answers every check</text>
  <rect x="30.0" y="96.0" width="900.0" height="46.0" rx="12" fill="#363941" stroke="#5d626a" stroke-width="1.3"/>
  <path transform="translate(44.0,109.0) scale(0.8333)" d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5zm0 2.18 7 3.12v4.92c0 1.7-.5 3.43-1.35 4.95C16 14.94 13.26 14.5 12 14.5s-4 .44-5.65 1.67C5.5 14.65 5 12.92 5 11.22V6.3zM12 6a3.5 3.5 0 0 0-3.5 3.5A3.5 3.5 0 0 0 12 13a3.5 3.5 0 0 0 3.5-3.5A3.5 3.5 0 0 0 12 6m0 2a1.5 1.5 0 0 1 1.5 1.5A1.5 1.5 0 0 1 12 11a1.5 1.5 0 0 1-1.5-1.5A1.5 1.5 0 0 1 12 8m0 8.5c1.57 0 3.64.61 4.53 1.34C15.29 19.38 13.7 20.55 12 21c-1.7-.45-3.29-1.62-4.53-3.16.9-.73 2.96-1.34 4.53-1.34" fill="#959ca3"/>
  <text x="74.0" y="125.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#e3e3e3" text-anchor="start" font-weight="bold">An admin passes every check.</text>
  <text x="310.0" y="125.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#9aa0ac" text-anchor="start" font-weight="normal">Everyone else gets a role on each project, then on each dashboard.</text>
  <rect x="30.0" y="172.0" width="230.0" height="170.0" rx="12" fill="#2e3b54" stroke="#48679f" stroke-width="1.5"/>
  <path transform="translate(43.5,186.5) scale(0.8750)" d="M12 4a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4m0 10c4.42 0 8 1.79 8 4v2H4v-2c0-2.21 3.58-4 8-4" fill="#77a2ef"/>
  <text x="74.0" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#86acf1" text-anchor="start" font-weight="bold">A user</text>
  <text x="46.0" y="228.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">their own role, if any:</text>
  <text x="46.0" y="248.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">owner, editor or viewer</text>
  <text x="46.0" y="268.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal"></text>
  <text x="46.0" y="288.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">and their groups',</text>
  <text x="46.0" y="308.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">read live from the groups</text>
  <rect x="320.0" y="172.0" width="290.0" height="170.0" rx="12" fill="#274246" stroke="#367c78" stroke-width="1.5"/>
  <path transform="translate(333.5,186.5) scale(0.8750)" d="M11.53 2c0 2.4 1.97 4.35 4.35 4.35h1.78v1.7c0 2.4 1.94 4.34 4.34 4.35V2.84a.84.84 0 0 0-.84-.84zM6.77 6.8a4.36 4.36 0 0 0 4.34 4.34h1.8v1.72a4.36 4.36 0 0 0 4.34 4.34V7.63a.84.84 0 0 0-.83-.83zM2 11.6c0 2.4 1.95 4.34 4.35 4.34h1.78v1.72c.01 2.39 1.95 4.34 4.34 4.34v-9.57a.84.84 0 0 0-.84-.84z" fill="#5bc1b6"/>
  <text x="364.0" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#6ec8be" text-anchor="start" font-weight="bold">Project role</text>
  <text x="336.0" y="228.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">the highest of their own</text>
  <text x="336.0" y="248.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">and their groups' roles</text>
  <text x="336.0" y="268.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal"></text>
  <text x="336.0" y="288.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">a public project: viewer</text>
  <text x="336.0" y="308.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">for anyone, signed in or not</text>
  <rect x="670.0" y="172.0" width="260.0" height="170.0" rx="12" fill="#4e382b" stroke="#a0612f" stroke-width="1.5"/>
  <path transform="translate(683.5,186.5) scale(0.8750)" d="M13 3v6h8V3m-8 18h8V11h-8M3 21h8v-6H3m0-2h8V3H3z" fill="#f7994b"/>
  <text x="714.0" y="203.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#f8a560" text-anchor="start" font-weight="bold">Dashboard role</text>
  <text x="686.0" y="228.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">the project role, unless the</text>
  <text x="686.0" y="248.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">dashboard's own owners or</text>
  <text x="686.0" y="268.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">editors name them: a guest</text>
  <text x="686.0" y="288.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">edits the copy they made</text>
  <path d="M260.0,257.0 L320.0,257.0" fill="none" stroke="#9aa0ac" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M320.0,257.0 L307.6,250.4" fill="none" stroke="#9aa0ac" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M320.0,257.0 L307.6,263.6" fill="none" stroke="#9aa0ac" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M610.0,257.0 L670.0,257.0" fill="none" stroke="#9aa0ac" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M670.0,257.0 L657.6,250.4" fill="none" stroke="#9aa0ac" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M670.0,257.0 L657.6,263.6" fill="none" stroke="#9aa0ac" stroke-width="1.7" stroke-linecap="round"/>
  <text x="30.0" y="384.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#e3e3e3" text-anchor="start" font-weight="bold">Then</text>
  <rect x="80.0" y="366.0" width="200.0" height="28.0" rx="14.0" fill="#274246" stroke="#367c78" stroke-width="1.2"/>
  <text x="180.0" y="384.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6ec8be" text-anchor="middle" font-weight="normal">owner: share, delete</text>
  <rect x="290.0" y="366.0" width="220.0" height="28.0" rx="14.0" fill="#274246" stroke="#367c78" stroke-width="1.2"/>
  <text x="400.0" y="384.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6ec8be" text-anchor="middle" font-weight="normal">editor: edit dashboards, data</text>
  <rect x="520.0" y="366.0" width="120.0" height="28.0" rx="14.0" fill="#274246" stroke="#367c78" stroke-width="1.2"/>
  <text x="580.0" y="384.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6ec8be" text-anchor="middle" font-weight="normal">viewer: read</text>
  <rect x="650.0" y="366.0" width="280.0" height="28.0" rx="14.0" fill="#4b262c" stroke="#962f30" stroke-width="1.2"/>
  <path transform="translate(659.5,372.5) scale(0.6250)" d="M12 2c5.5 0 10 4.5 10 10s-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2m0 2c-1.9 0-3.6.6-4.9 1.7l11.2 11.2c1-1.4 1.7-3.1 1.7-4.9 0-4.4-3.6-8-8-8m4.9 14.3L5.7 7.1C4.6 8.4 4 10.1 4 12c0 4.4 3.6 8 8 8 1.9 0 3.6-.6 4.9-1.7" fill="#e8514d"/>
  <text x="680.0" y="384.5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#eb6561" text-anchor="start" font-weight="normal">no role: 404, as if it did not exist</text>
  <text x="30.0" y="432.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">A refusal looks like a missing resource, so it tells nothing about what exists. Sign-in-free visitors match</text>
  <text x="30.0" y="453.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9aa0ac" text-anchor="start" font-weight="normal">public projects only. Group membership is read on every check, so a change applies at once.</text>
</svg>
