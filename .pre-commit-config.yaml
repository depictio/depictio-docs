# The home page's live examples are generated (dev/export_components.py):
# pages that inline their data and one ~10 MB viewer bundle per instance.
# The fixers would rewrite them and the size check would refuse them.
exclude: ^docs/images/landing/live/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow Python tags used by MkDocs Material
      - id: check-added-large-files
        # Default 500 kB is too tight for high-DPI dashboard screenshots
        # (anti-aliased UI text + plotly charts). Cap at ~2 MB so we
        # still catch accidental binary commits.
        args: [--maxkb=2000]
      - id: mixed-line-ending

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json, "README.md", "docs/"]

  - repo: local
    hooks:
      - id: check-mkdocs-links
        name: Check MkDocs links
        entry: mkdocs build
        language: system
        pass_filenames: false
        files: \.(md|yml|yaml)$

